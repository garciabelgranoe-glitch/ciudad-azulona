<!DOCTYPE html>
<html lang="es">
  <body style="margin:0; padding:32px 16px; background-color:#F3ECD9; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" style="max-width:420px; margin:0 auto;">
      <tr>
        <td style="text-align:center; padding-bottom:16px;">
          <span style="font-size:12px; letter-spacing:2px; color:#B9862F; font-weight:bold;">CIUDAD AZULONA</span>
        </td>
      </tr>
      <tr>
        <td style="background-color:#FFFFFF; border:2px solid #20291C; border-radius:12px; padding:28px 24px; text-align:center;">
          <p style="margin:0 0 8px; font-size:15px; color:#20291C; font-weight:bold;">Tu código para entrar</p>
          <p style="margin:0 0 20px; font-size:13px; color:#6b6357;">Copialo en la app para completar el ingreso.</p>
          <div style="font-size:32px; font-weight:bold; letter-spacing:8px; color:#20291C; background-color:#F3ECD9; border-radius:8px; padding:14px 8px; margin:0 0 16px;">
            {{ .Token }}
          </div>
          <p style="margin:0; font-size:11px; color:#8a8275;">
            Vence en una hora. Si no pediste este código, ignorá este mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
